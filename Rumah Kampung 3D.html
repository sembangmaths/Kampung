<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumah Kampung 3D</title>
<style>
:root{--bg:#87c0ff;--fg:#fff;--chip:rgba(0,0,0,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2a40;--fg:#fff;--chip:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#1c2a40;--fg:#fff;--chip:rgba(0,0,0,.6)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{display:block;touch-action:none}
#pad{display:none;position:fixed;left:24px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:var(--chip);touch-action:none;align-items:center;justify-content:center}
#knob{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none}
@media (pointer:coarse){#pad{display:flex}}
#info{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--chip);color:var(--fg);padding:8px 14px;border-radius:20px;font-size:13px;text-align:center;max-width:90vw}
#jam{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;background:var(--chip);color:var(--fg);border-radius:16px;padding:8px 12px 8px 8px;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;user-select:none}
#jam svg{width:76px;height:76px;flex:none}
#dig{font-size:26px;font-weight:600;line-height:1.1}
#d2{font-size:15px;opacity:.9}
#ket{font-size:12px;opacity:.85;margin-top:2px}
#fmt{margin-top:6px;border:0;border-radius:12px;padding:4px 12px;font-size:12px;background:rgba(255,255,255,.22);color:var(--fg);cursor:pointer}
</style>
</head>
<body>
<div id="info">Klik skrin untuk kunci tetikus · tetikus: pandang · WASD: jalan · Shift: lari · Space: lompat · E: buka pintu · Esc: lepas tetikus · F: format jam</div>
<div id="jam"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="rgba(255,255,255,.12)" stroke="currentColor" stroke-width="2"/><g id="tk"></g><line id="hj" x1="50" y1="50" x2="50" y2="29" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line id="mn" x1="50" y1="50" x2="50" y2="16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="#e6b333"/></svg><div><div id="dig">07:00</div><div id="d2"></div><div id="ket"></div><button id="fmt" title="Tukar format jam (F)">24J</button></div></div>
<div id="pad"><div id="knob"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T = THREE;
let sd = 11; const rnd = (a=0,b=1)=>{sd=(sd*16807)%2147483647;return a+(sd/2147483647)*(b-a)};
const uT={value:0},uG={value:1},WIND=new T.Vector3(1,0,.35).normalize();let GUST=.3,kec=0,gT=.3,gN=0,gB=.3;
const scene = new T.Scene();
scene.background = new T.Color(0x87c0ff);
scene.fog = new T.Fog(0xcfe4f5, 45, 120);
const cam = new T.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
const ren = new T.WebGLRenderer({antialias:true});
ren.setSize(innerWidth, innerHeight); ren.setPixelRatio(Math.min(devicePixelRatio,1.5));
ren.shadowMap.enabled = true; ren.shadowMap.type = T.PCFSoftShadowMap; ren.toneMapping = T.ACESFilmicToneMapping; ren.toneMappingExposure = 1.25;
document.body.appendChild(ren.domElement);

// Cahaya
const hemi=new T.HemisphereLight(0xcfe8ff, 0x6b8f3a, 0.75); scene.add(hemi);
const sun = new T.DirectionalLight(0xfff2d8, 0.95);
sun.position.set(18, 26, 16); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-24,right:24,top:24,bottom:-24,near:1,far:80});
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 3; scene.add(sun.target);
scene.add(sun);
const sky=new T.Mesh(new T.SphereGeometry(200,24,12),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,
uniforms:{uTop:{value:new T.Color(.25,.52,.92)},uHor:{value:new T.Color(.81,.91,.98)},uSun:{value:new T.Vector3(0,30,16)}},vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform vec3 uTop;uniform vec3 uHor;uniform vec3 uSun;varying vec3 p;void main(){float h=clamp(p.y,0.,1.);vec3 c=mix(uHor,uTop,pow(h,.55));float d=max(dot(p,normalize(uSun)),0.);c+=vec3(1.,.8,.5)*(pow(d,400.)*2.+pow(d,12.)*.25)*step(-.05,uSun.y);gl_FragColor=vec4(c,1.);}'}));
scene.add(sky);
const pelitaL = new T.PointLight(0xffb060, 0.9, 7); pelitaL.position.set(0, 3.2, 3.4); scene.add(pelitaL);

// Bahan
const mats = {};
const M = (c, r=0.8) => mats[c+r] || (mats[c+r] = new T.MeshStandardMaterial({color:c, roughness:r}));
const C = {kayu:0x61381a, gelap:0x331c0f, dinding:0xb88047, garis:0x734724, atap:0x993320, atapG:0x541710,
  lantai:0x80522b, putih:0xebe6d1, kaca:0x8cbfe6, hijau:0x148066, pintu:0x4d2612, emas:0xe6b333,
  rumput:0x338c1f, tanah:0x8c663d, batu:0x949487, batuG:0x5c5c57, buluh:0xb39947, air:0x1a5999,
  tembikar:0xb34d26, batang:0x472b17, bKelapa:0x735938, kelapa:0x664d1a, pisangB:0x80a64d,
  dPisang:0x4db333, dKelapa:0x1f8026, pisang:0xf2cc26, merah:0xe61a1a, kuning:0xffcc1a,
  jambu:0xff6699, ungu:0x9940cc, biru:0x1a4dcc, jingga:0xf28019};
const DAUN = [0x1a6b1a, 0x339424, 0x52a32e];

// Fungsi bantu
const root = new T.Group(); scene.add(root);
function add(m, x, y, z, parent=root, sh=true){ m.position.set(x,y,z); m.castShadow = sh; m.receiveShadow = true; parent.add(m); return m; }
const box = (w,h,d,x,y,z,c,p) => add(new T.Mesh(new T.BoxGeometry(w,h,d), M(c)), x,y,z,p);
const cyl = (r1,r2,h,x,y,z,c,p,s=12) => add(new T.Mesh(new T.CylinderGeometry(r2,r1,h,s), M(c)), x,y,z,p);
const sph = (sx,sy,sz,x,y,z,c,p,s=12) => { const m = add(new T.Mesh(new T.SphereGeometry(1,s,Math.max(4,s>>1)), M(c,0.7)), x,y,z,p); m.scale.set(sx,sy,sz); return m; };
function seg(a, b, r1, r2, c, p, s=8){
  const A = new T.Vector3(...a), B = new T.Vector3(...b), d = B.clone().sub(A);
  const m = new T.Mesh(new T.CylinderGeometry(r2, r1, d.length(), s), M(c));
  m.position.copy(A.clone().add(B).multiplyScalar(0.5));
  m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), d.normalize());
  m.castShadow = true; m.receiveShadow = true; (p||root).add(m); return m;
}

// Tanah
const gc=document.createElement('canvas');gc.width=gc.height=256;const gx=gc.getContext('2d');gx.fillStyle='#62bb38';gx.fillRect(0,0,256,256);
for(let i=0;i<1800;i++){gx.fillStyle='hsla('+(88+Math.random()*35)+','+(45+Math.random()*25)+'%,'+(32+Math.random()*18)+'%,.03)';gx.beginPath();gx.arc(Math.random()*256,Math.random()*256,2+Math.random()*7,0,6.3);gx.fill();}
const gt=new T.CanvasTexture(gc);gt.wrapS=gt.wrapT=T.RepeatWrapping;gt.repeat.set(70,70);gt.anisotropy=4;
const rumput = new T.Mesh(new T.PlaneGeometry(300,300), new T.MeshStandardMaterial({map:gt,roughness:1})); rumput.rotation.x = -Math.PI/2; rumput.receiveShadow = true; root.add(rumput);
const halaman = sph(7.5,0.04,9,0,0.02,5,C.tanah,root,32); halaman.castShadow = false;

// Rumah: tiang & lantai (depan = +z)
const LT = 1.6;
for (const x of [-3,0,3]) for (const z of [-2,2]) { cyl(0.22,0.2,0.2,x,0.1,z,C.batu,root,10); cyl(0.13,0.13,LT,x,LT/2,z,C.kayu,root,10); }
for (const x of [-3,-1.5,1.5,3]) { cyl(0.22,0.2,0.2,x,0.1,3.4,C.batu,root,10); cyl(0.13,0.13,LT,x,LT/2,3.4,C.kayu,root,10); }
for (const z of [3.4,2,-2]) box(6.6,0.15,0.15,0,LT-0.27,z,C.kayu);
box(6.6,0.2,5.8,0,LT-0.1,0.7,C.lantai);

// Dinding
box(6,2.8,4,0,LT+1.4,0,C.dinding);
for (let k=0;k<8;k++){ const y = LT+0.2+k*0.33;
  box(6,0.03,0.04,0,y,2.02,C.garis); box(6,0.03,0.04,0,y,-2.02,C.garis);
  box(0.04,0.03,4,3.02,y,0,C.garis); box(0.04,0.03,4,-3.02,y,0,C.garis); }
for (const x of [-3,3]) for (const z of [-2,2]) box(0.22,2.8,0.22,x,LT+1.4,z,C.kayu);
for (const z of [-2,2]) box(6.3,0.16,0.16,0,LT+2.72,z,C.gelap);
for (const x of [-3,3]) box(0.16,0.16,4.3,x,LT+2.72,0,C.gelap);

// Pintu (klik untuk buka)
box(1.3,2.16,0.1,0,LT+1.08,2.04,C.gelap);
const hinge = new T.Group(); hinge.position.set(-0.52, LT, 2.09); root.add(hinge);
box(1.05,2,0.05,0.52,1,0,C.pintu,hinge);
for (const y of [0.6,1.45]) box(0.8,0.7,0.02,0.52,y,0.03,C.kayu,hinge);
sph(0.04,0.04,0.04,0.9,1,0.06,C.emas,hinge,8);
hinge.traverse(o => { o.userData.pintu = true; });
box(1.9,0.3,0.08,0,LT+2.3,2.07,C.gelap);
for (let i=0;i<5;i++){ const m = box(0.14,0.14,0.03,-0.6+0.3*i,LT+2.3,2.13,C.emas); m.rotation.z = Math.PI/4; }
// Bekas: pintu gelap di belakang
box(0.95,1.9,0.02,0,LT+1,2.03,0x1a0f08);

// Tingkap
function tingkap(x, y, z, ry){
  const g = new T.Group(); g.position.set(x,y,z); g.rotation.y = ry; root.add(g);
  box(1.4,1.4,0.1,0,0,0.03,C.putih,g);
  const k = new T.Mesh(new T.BoxGeometry(1.1,1.1,0.04), new T.MeshStandardMaterial({color:C.kaca,roughness:0.05,metalness:0.2}));
  add(k,0,0,0.09,g);
  box(1.1,0.05,0.03,0,0,0.12,C.putih,g); box(0.05,1.1,0.03,0,0,0.12,C.putih,g);
  box(1.7,0.07,0.3,0,-0.72,0.13,C.gelap,g);
  for (const s of [-1,1]) { const d = box(0.6,1.3,0.05,s*1.0,0,0.35,C.hijau,g); d.rotation.y = s*0.9; d.position.set(s*(0.7+0.3*Math.cos(0.9)), 0, 0.08+0.3*Math.sin(0.9)); }
}
const zt = LT+1.6;
tingkap(-2,zt,2,0); tingkap(2,zt,2,0);
tingkap(3,zt,0,Math.PI/2); tingkap(-3,zt,0,-Math.PI/2);
tingkap(-1.5,zt,-2,Math.PI); tingkap(1.5,zt,-2,Math.PI);

// Bumbung
const z0 = LT+2.8, H = 1.4, a = 2.0, ov = 0.55, th = Math.atan2(H,a);
const sl = (a+ov)/Math.cos(th)+0.05, L = 7;
for (const t of [1,-1]){
  const dir = new T.Vector3(0,-Math.sin(th),t*Math.cos(th));
  const c = new T.Vector3(0,z0+H,0).add(dir.clone().multiplyScalar(sl/2-0.05));
  const slab = box(L,0.1,sl,c.x,c.y,c.z,C.atap); slab.rotation.x = t*th;
  const n = new T.Vector3(0,1,0).applyEuler(slab.rotation);
  for (let i=0;i<14;i++){ const r = box(0.07,0.05,sl-0.05,-3.25+i*0.5,0,0,C.atapG); r.position.copy(c).addScaledVector(n,0.07); r.position.x = -3.25+i*0.5; r.rotation.x = t*th; }
  const e = c.clone().addScaledVector(dir, sl/2-0.05); e.y -= 0.05;
  box(L,0.22,0.06,0,e.y,e.z,C.gelap);
}
cyl(0.12,0.12,L+0.3,0,z0+H+0.1,0,C.atapG,root,8).rotation.z = Math.PI/2;
for (const sx of [-1,1]){
  const sp = cyl(0.0,0.07,0.8,sx*(L/2+0.1),z0+H+0.5,0,C.gelap,root,8);
  const shp = new T.Shape(); shp.moveTo(-a,0); shp.lineTo(a,0); shp.lineTo(0,H);
  const tg = new T.Mesh(new T.ShapeGeometry(shp), new T.MeshStandardMaterial({color:C.dinding,side:T.DoubleSide}));
  tg.rotation.y = Math.PI/2; tg.position.set(sx*3,z0,0); tg.castShadow = true; root.add(tg);
  const la = box(0.04,0.4,0.4,sx*3.03,z0+0.5,0,C.gelap); la.rotation.x = Math.PI/4;
}

// Serambi
const phi = Math.atan2(0.45,1.9);
const sat = box(6.9,0.08,1.96,0,3.72,2.95,C.atap); sat.rotation.x = phi;
for (let i=0;i<13;i++){ const r = box(0.07,0.04,1.9,-3+i*0.5,3.78,2.96,C.atapG); r.rotation.x = phi; }
box(6.9,0.18,0.05,0,3.46,3.9,C.gelap); box(6.5,0.16,0.14,0,3.5,3.4,C.kayu);
for (const x of [-3,-1.5,1.5,3]) cyl(0.1,0.1,2,x,LT+1,3.4,C.kayu,root,10);
const ZA = LT+0.95, ZB = LT+0.45;
function pagar(x1,z1,x2,z2){
  for (const y of [ZA,ZB]) seg([x1,y,z1],[x2,y,z2],0.04,0.04,C.kayu,root,8);
  const n = Math.max(2, Math.round(Math.hypot(x2-x1,z2-z1)/0.35));
  for (let i=0;i<=n;i++){ const t=i/n; cyl(0.03,0.03,0.85,x1+(x2-x1)*t,LT+0.52,z1+(z2-z1)*t,C.kayu,root,6); }
}
pagar(-3,3.4,-0.8,3.4); pagar(0.8,3.4,3,3.4); pagar(-3,3.4,-3,2); pagar(3,3.4,3,2);

// Tangga
const nA = 6, naik = LT/7, lb = 0.34;
for (let i=0;i<nA;i++){ const top = LT-(i+1)*naik;
  box(1.4,top,lb,0,top/2,3.6+lb*(i+.5),C.kayu); box(1.45,0.03,lb+0.02,0,top+0.015,3.6+lb*(i+.5),C.gelap); }
const zb = 3.6+lb*nA;
for (const sx of [-0.72,0.72]){ seg([sx,LT+0.95,3.6],[sx,1.1,zb],0.04,0.04,C.kayu); cyl(0.05,0.05,1.15,sx,0.57,zb,C.kayu,root,8); }

// Bangku & pasu
box(1.5,0.07,0.4,-1.9,LT+0.45,2.4,C.kayu);
for (const lx of [-0.65,0.65]) for (const lz of [-0.15,0.15]) cyl(0.04,0.04,0.45,-1.9+lx,LT+0.22,2.4+lz,C.kayu,root,6);

// Semak + bunga
function semak(x,y,z,r=0.35,bunga=true){
  sph(r,r*0.8,r,x,y+r*0.7,z,DAUN[(rnd(0,3))|0],root,10);
  if (bunga){ const w = [C.merah,C.kuning,C.jambu,C.ungu][(rnd(0,4))|0];
    for (let i=0;i<7;i++){ const v = new T.Vector3(rnd(-1,1),rnd(0.2,1),rnd(-1,1)).normalize();
      sph(0.07,0.07,0.07,x+v.x*r,y+r*0.7+v.y*r*0.8,z+v.z*r,w,root,6); } }
}
for (const px of [-2.7,2.7]){ cyl(0.22,0.16,0.35,px,LT+0.18,3.15,C.tembikar,root,12); semak(px,LT+0.3,3.15,0.28); }

// Pelita
seg([0,3.5,3.4],[0,3.3,3.4],0.01,0.01,C.gelap);
const pel = new T.Mesh(new T.SphereGeometry(1,10,8), new T.MeshStandardMaterial({color:0xffc060,emissive:0xff9930,emissiveIntensity:1.6}));
pel.scale.set(0.11,0.15,0.11); pel.position.set(0,3.2,3.4); root.add(pel);

// Laluan batu
for (let i=0;i<14;i++){ const z = 6.2+i*0.5, r = rnd(0.28,0.38);
  cyl(r*0.95,r,0.09,Math.sin(i*0.55)*0.7,0.05,z,[C.batu,C.batuG][(rnd(0,2))|0],root,10); }

// Pokok
const sway = [];
function rimbun(x,z,s=1){
  const h = rnd(2.2,3)*s;
  seg([x,0,z],[x+0.1*s,h,z],0.28*s,0.18*s,C.batang,root,10);
  for (let i=0;i<3;i++){ const an = rnd(0,6.28); seg([x,h*0.8,z],[x+Math.cos(an)*s,h+0.8*s,z+Math.sin(an)*s],0.1*s,0.06*s,C.batang); }
  for (let i=0;i<6;i++){ const an = rnd(0,6.28), d = rnd(0,1.3)*s, r = rnd(1,1.6)*s;
    const c = [x+Math.cos(an)*d, h+rnd(0.6,1.6)*s, z+Math.sin(an)*d];
    {const lf=sph(r,r*0.85,r,c[0],c[1],c[2],DAUN[(rnd(0,3))|0],root,10);sway.push({o:lf,bx:c[0],bz:c[2],ph:Math.random()*6.28,amp:.05,k:1,axis:'drift'});}
    if (rnd()<0.4) for (let k=0;k<2;k++){ const v = new T.Vector3(rnd(-1,1),rnd(0,1),rnd(-1,1)).normalize();
      sph(0.09*s,0.09*s,0.09*s,c[0]+v.x*r,c[1]+v.y*r*0.85,c[2]+v.z*r,C.merah,root,6); } }
}
function kelapa(x,z,s=1){
  const tg = rnd(6,8)*s, ar = rnd(0,6.28), lk = rnd(0.6,1.4)*s, n = 8, pts = [];
  for (let i=0;i<=n;i++){ const t=i/n; pts.push([x+Math.cos(ar)*lk*t*t, tg*t, z+Math.sin(ar)*lk*t*t]); }
  for (let i=0;i<n;i++) seg(pts[i],pts[i+1],0.22*s*(1-0.4*i/n),0.22*s*(1-0.4*(i+1)/n),C.bKelapa,root,10);
  const m = pts[n], crown = new T.Group(); crown.position.set(...m); root.add(crown);
  for (let k=0;k<9;k++){ const an = Math.PI*2*k/9+rnd(-0.2,0.2), semi = rnd(1.8,2.4)*s/2;
    const g = new T.Group(); g.rotation.y = an; crown.add(g);
    const piv = new T.Group(); piv.rotation.z = -rnd(0.35,0.7); g.add(piv);
    const f = sph(semi,0.03*s,0.28*s,semi,0,0,C.dKelapa,piv,10);
    sway.push({o:piv, base:piv.rotation.z, ph:rnd(0,6.28), amp:0.07}); }
  for (let i=0;i<4;i++){ const an = rnd(0,6.28); sph(0.16*s,0.16*s,0.16*s,Math.cos(an)*0.25*s,-0.25*s,Math.sin(an)*0.25*s,C.kelapa,crown,8); }
}
function pisang(x,z,s=1){
  const t = 1.6*s; seg([x,0,z],[x,t,z],0.16*s,0.12*s,C.pisangB,root,10);
  for (let i=0;i<6;i++){ const an = rnd(0,6.28), semi = 0.9*s;
    const g = new T.Group(); g.position.set(x,t,z); g.rotation.y = an; root.add(g);
    const piv = new T.Group(); piv.rotation.z = -rnd(0.4,0.9); g.add(piv);
    sph(semi,0.025*s,0.45*s,semi,0,0,C.dPisang,piv,10);
    sway.push({o:piv, base:piv.rotation.z, ph:rnd(0,6.28), amp:0.05}); }
  for (let k=0;k<6;k++) sph(0.06*s,0.22*s,0.06*s,x+0.22*s+0.07*(k%3),t-0.35-0.06*((k/3)|0),z+0.05*((k/3)|0),C.pisang,root,8);
